name: OpenDente
options:
  bundleIdPrefix: com.opendente
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_UPCOMING_FEATURE_GLOBAL_ACTOR_ISOLATED_TYPES_USABILITY: false
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  OpenDente:
    type: application
    platform: macOS
    sources:
      - path: OpenDente
        excludes:
          - Resources/Assets.xcassets/AppIcon.appiconset
          - Resources/opendente-release.json
      - path: Shared
      - path: OpenDente/Resources/opendente-release.json
        buildPhase: resources
    resources:
      - path: OpenDente/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: OpenDente/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenDente/Resources/OpenDente.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.opendente.app
        PRODUCT_NAME: OpenDente
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/OpenDente/OpenDente-Bridging-Header.h"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: OpenDente/Resources/OpenDente.entitlements
    dependencies:
      - target: OpenDenteHelper
    postBuildScripts:
      - name: "Bundle Helper & Stamp Version"
        script: |
          # Keep the numeric build version; store the source revision separately.
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          GIT_HASH=$(git -C "${SRCROOT}" rev-parse --short HEAD)
          /usr/libexec/PlistBuddy -c "Delete :OpenDenteGitRevision" "${PLIST}" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :OpenDenteGitRevision string ${GIT_HASH}" "${PLIST}"

          # Copy helper tool into app bundle
          HELPER_TOOLS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/HelperTools"
          mkdir -p "${HELPER_TOOLS_DIR}"
          cp "${BUILT_PRODUCTS_DIR}/com.opendente.helper" "${HELPER_TOOLS_DIR}/com.opendente.helper"

          # Copy helper LaunchDaemon plist into app bundle
          LAUNCH_DAEMONS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "${LAUNCH_DAEMONS_DIR}"
          cp "${SRCROOT}/OpenDenteHelper/com.opendente.helper.plist" "${LAUNCH_DAEMONS_DIR}/com.opendente.helper.plist"
        basedOnDependencyAnalysis: false

  OpenDenteHelper:
    type: tool
    platform: macOS
    sources:
      - path: OpenDenteHelper
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
      - path: OpenDente/Services/SMCService.swift
      - path: OpenDente/Models/BatteryState.swift
    settings:
      base:
        INFOPLIST_FILE: OpenDenteHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.opendente.helper
        PRODUCT_NAME: com.opendente.helper
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: OpenDenteHelper/OpenDenteHelper.entitlements

  OpenDenteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenDenteTests
    dependencies:
      - target: OpenDente
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opendente.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  OpenDenteHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenDenteHelperTests
      - path: OpenDenteHelper
        excludes:
          - main.swift
          - "*.plist"
          - "*.entitlements"
      - path: Shared
      - path: OpenDente/Services/SMCService.swift
      - path: OpenDente/Models/BatteryState.swift
      - path: OpenDente/Services/HelperClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opendente.helper.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  OpenDente:
    build:
      targets:
        OpenDente: all
        OpenDenteHelperTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - OpenDenteTests
        - OpenDenteHelperTests
  OpenDenteHelperTests:
    build:
      targets:
        OpenDenteHelperTests: all
    test:
      targets:
        - OpenDenteHelperTests
